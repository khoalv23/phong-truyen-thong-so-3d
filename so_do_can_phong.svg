<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Sơ đồ không gian trưng bày từ cửa vào</title>
  <desc id="desc">Sơ đồ bám theo minimap hiện tại, lấy cửa chính phía dưới làm mốc và đặt mã biển tên theo đúng bức tường trưng bày.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#173F5F" flood-opacity=".12"/></filter>
    <marker id="entry-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#9B302F"/></marker>
    <style>
      text{font-family:"Roboto",Arial,sans-serif;fill:#173F5F}
      .room{stroke:#6F8293;stroke-width:2.2;stroke-linejoin:round;filter:url(#shadow)}
      .room-name{font-size:17px;font-weight:700;text-anchor:middle}
      .room-sub{font-size:11px;font-weight:400;text-anchor:middle;fill:#526978}
      .code{font-size:10px;font-weight:700;text-anchor:middle;dominant-baseline:middle;fill:#FFFFFF}
      .legend-title{font-size:13px;font-weight:700}
      .legend-text{font-size:11px;font-weight:400;fill:#405566}
      .legend-code{font-size:10px;font-weight:700;fill:#173F5F}
    </style>
  </defs>

  <rect width="1200" height="900" fill="#F8F6F1"/>
  <text x="600" y="38" text-anchor="middle" font-size="27" font-weight="700">SƠ ĐỒ KHÔNG GIAN TRƯNG BÀY</text>
  <text x="600" y="66" text-anchor="middle" font-size="16" font-weight="500" fill="#9B302F">CHỦ ĐỀ 4 · HỘI NHẬP – SÁNG TẠO – TIÊN PHONG</text>
  <text x="600" y="88" text-anchor="middle" font-size="11" font-weight="400" fill="#70818D">Hướng nhìn và vị trí phòng bám theo minimap hiện tại</text>

  <!-- Central circulation ring, matching minimap geometry -->
  <circle cx="600" cy="360" r="164" fill="#8FA9BB" fill-opacity=".28" stroke="#8FA9BB" stroke-width="1.5"/>

  <!-- Góc 2: far left from the entrance -->
  <polygon class="room" fill="#DCEEFF" points="423.2,323.3 513.2,201.7 381.5,104.3 291.5,225.9"/>
  <rect x="348" y="196" width="112" height="48" rx="10" fill="#FFFFFF" fill-opacity=".94"/>
  <text class="room-name" x="404" y="216">GÓC 2</text>
  <text class="room-name" x="404" y="236">ĐỔI MỚI SÁNG TẠO</text>
  <text class="room-sub" x="404" y="259">Khởi nghiệp</text>
  <g transform="translate(357 275)"><rect x="-25" y="-12" width="50" height="24" rx="12" fill="#005BAA"/><text class="code" y="1">ST-1</text></g>
  <g transform="translate(337 165)"><rect x="-25" y="-12" width="50" height="24" rx="12" fill="#005BAA"/><text class="code" y="1">ST-2</text></g>
  <g transform="translate(447 153)"><rect x="-25" y="-12" width="50" height="24" rx="12" fill="#005BAA"/><text class="code" y="1">ST-3</text></g>

  <!-- Góc 1: near left from the entrance -->
  <polygon class="room" fill="#FFF1C5" points="513.2,518.3 423.2,396.7 291.5,494.1 381.5,615.7"/>
  <rect x="348" y="486" width="112" height="48" rx="10" fill="#FFFFFF" fill-opacity=".94"/>
  <text class="room-name" x="404" y="506">GÓC 1</text>
  <text class="room-name" x="404" y="526">CHUYỂN ĐỔI SỐ</text>
  <text class="room-sub" x="404" y="548">Trong công tác Đoàn</text>
  <g transform="translate(371 436)"><rect x="-28" y="-12" width="56" height="24" rx="12" fill="#D99A00"/><text class="code" y="1">CĐS-1</text></g>
  <g transform="translate(337 460)"><rect x="-28" y="-12" width="56" height="24" rx="12" fill="#D99A00"/><text class="code" y="1">CĐS-4</text></g>
  <g transform="translate(337 580)"><rect x="-28" y="-12" width="56" height="24" rx="12" fill="#D99A00"/><text class="code" y="1">CĐS-2</text></g>
  <g transform="translate(447 567)"><rect x="-28" y="-12" width="56" height="24" rx="12" fill="#D99A00"/><text class="code" y="1">CĐS-3</text></g>

  <!-- Góc 3: merged east region, matching minimap polygon -->
  <polygon class="room" fill="#E3EAEE" points="686.8,201.7 818.5,104.3 908.5,225.9 908.5,494.1 818.5,615.7 686.8,518.3 776.8,396.7 776.8,323.3"/>
  <rect x="786" y="333" width="108" height="54" rx="10" fill="#FFFFFF" fill-opacity=".95"/>
  <text class="room-name" x="840" y="354">GÓC 3</text>
  <text class="room-name" x="840" y="375">HỘI NHẬP QUỐC TẾ</text>
  <g transform="translate(753 153)"><rect x="-26" y="-12" width="52" height="24" rx="12" fill="#6F8293"/><text class="code" y="1">HN-1</text></g>
  <g transform="translate(864 165)"><rect x="-26" y="-12" width="52" height="24" rx="12" fill="#6F8293"/><text class="code" y="1">HN-2</text></g>
  <g transform="translate(909 360)"><rect x="-26" y="-12" width="52" height="24" rx="12" fill="#6F8293"/><text class="code" y="1">HN-3</text></g>
  <g transform="translate(864 555)"><rect x="-26" y="-12" width="52" height="24" rx="12" fill="#6F8293"/><text class="code" y="1">HN-4</text></g>
  <g transform="translate(753 567)"><rect x="-26" y="-12" width="52" height="24" rx="12" fill="#6F8293"/><text class="code" y="1">HN-5</text></g>

  <!-- Hub from minimap -->
  <circle cx="600" cy="360" r="38" fill="#F4F7F9" stroke="#D6B86F" stroke-width="2"/>
  <text x="600" y="356" text-anchor="middle" font-size="13" font-weight="700">SẢNH</text>
  <text x="600" y="373" text-anchor="middle" font-size="10" font-weight="400" fill="#607584">TRUNG TÂM</text>

  <!-- South gate and entrance vestibule from minimap -->
  <polygon points="513.2,523.9 686.8,523.9 686.8,518.3 513.2,518.3" fill="#8FA9BB" fill-opacity=".55"/>
  <rect x="574.8" y="518.3" width="50.4" height="20.2" fill="#8FA9BB" fill-opacity=".78"/>
  <path d="M600 661L600 548" stroke="#9B302F" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#entry-arrow)"/>
  <rect x="535" y="633" width="130" height="34" rx="17" fill="#FFFFFF" stroke="#9B302F" stroke-width="1.5"/>
  <text x="600" y="655" text-anchor="middle" font-size="13" font-weight="700" fill="#9B302F">CỬA VÀO CHÍNH</text>
  <text x="600" y="681" text-anchor="middle" font-size="10" font-weight="400" fill="#70818D">Mốc xác định vị trí các góc phòng</text>

  <!-- Legend follows the same wall positions and clockwise order shown above -->
  <g transform="translate(55 704)">
    <rect width="1090" height="170" rx="14" fill="#FFFFFF" stroke="#D9E0E5" stroke-width="1.5"/>
    <text x="20" y="25" class="legend-title">CHÚ GIẢI THEO VỊ TRÍ BIỂN TRÊN TƯỜNG</text>
    <line x1="20" y1="36" x2="1070" y2="36" stroke="#E1E6EA"/>
    <line x1="374" y1="48" x2="374" y2="151" stroke="#E1E6EA"/>
    <line x1="654" y1="48" x2="654" y2="151" stroke="#E1E6EA"/>

    <rect x="20" y="49" width="14" height="14" rx="4" fill="#F4B223"/><text x="43" y="61" class="legend-title">GÓC 1 · GẦN CỬA, BÊN TRÁI</text>
    <text x="20" y="82" class="legend-code">CĐS-1</text><text x="70" y="82" class="legend-text">Các hoạt động trên nền tảng số</text>
    <text x="20" y="101" class="legend-code">CĐS-4</text><text x="70" y="101" class="legend-text">Kỹ năng thích ứng của đoàn viên trên môi trường số</text>
    <text x="20" y="120" class="legend-code">CĐS-2</text><text x="70" y="120" class="legend-text">Phong trào Bình dân học vụ số</text>
    <text x="20" y="139" class="legend-code">CĐS-3</text><text x="70" y="139" class="legend-text">Từ năng lực số đến hành động cộng đồng</text>

    <rect x="394" y="49" width="14" height="14" rx="4" fill="#005BAA"/><text x="417" y="61" class="legend-title">GÓC 2 · PHÍA SÂU, BÊN TRÁI</text>
    <text x="394" y="82" class="legend-code">ST-1</text><text x="436" y="82" class="legend-text">Sáng tạo khoa học</text>
    <text x="394" y="101" class="legend-code">ST-2</text><text x="436" y="101" class="legend-text">Dự án khởi nghiệp</text>
    <text x="394" y="120" class="legend-code">ST-3</text><text x="436" y="120" class="legend-text">Rèn luyện nghiệp vụ</text>

    <rect x="674" y="49" width="14" height="14" rx="4" fill="#6F8293"/><text x="697" y="61" class="legend-title">GÓC 3 · TOÀN BỘ KHU BÊN PHẢI</text>
    <text x="674" y="82" class="legend-code">HN-1</text><text x="719" y="82" class="legend-text">Học tập và trao đổi quốc tế</text>
    <text x="674" y="101" class="legend-code">HN-2</text><text x="719" y="101" class="legend-text">Trải nghiệm quốc tế của sinh viên HNUE</text>
    <text x="674" y="120" class="legend-code">HN-3</text><text x="719" y="120" class="legend-text">Hội nhập quốc tế · Bản đồ Thanh niên HNUE</text>
    <text x="674" y="139" class="legend-code">HN-4</text><text x="719" y="139" class="legend-text">Giao lưu ngôn ngữ và văn hóa</text>
    <text x="674" y="158" class="legend-code">HN-5</text><text x="719" y="158" class="legend-text">Kết nối và hợp tác quốc tế</text>
  </g>

  <text x="600" y="893" text-anchor="middle" font-size="9.5" font-weight="400" fill="#70818D">Sơ đồ định hướng theo minimap · Không sử dụng làm bản vẽ thi công</text>
</svg>